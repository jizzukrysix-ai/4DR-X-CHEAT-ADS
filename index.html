<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1226">
<title>Key Generator Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root {
  --bg: #090d1a;
  --panel: #131a32;
  --panel-border: rgba(255, 255, 255, 0.08);
  --accent: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.4);
  --success: #10b981;
  --text: #f8fafc;
  --muted: #94a3b8;
  --card-bg: rgba(255, 255, 255, 0.03);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}

#app {
  position: relative;
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 16px;
  overflow-y: auto;
}

/* Header */
header {
  text-align: center;
  padding: 8px 0;
}
header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
header p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
}

/* Main Split Container */
.main-card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
}

/* Square Image Box */
.image-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 14px;
  overflow: hidden;
  background: var(--card-bg);
  border: 1px dashed rgba(255, 255, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.image-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}

/* Controls / Ads Section */
.controls-box {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
}
.progress-bar-bg {
  height: 8px;
  width: 100%;
  background: var(--card-bg);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--panel-border);
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4f46e5, #818cf8);
  transition: width 0.4s ease;
}

/* Buttons */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px var(--accent-glow);
  transition: all 0.2s ease;
}
.btn:active {
  transform: scale(0.98);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}
.btn-success {
  background: var(--success);
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
}

/* Key Output Section */
.key-box {
  display: none;
  flex-direction: column;
  gap: 10px;
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid rgba(16, 185, 129, 0.2);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}
.key-box.on {
  display: flex;
}
.key-value {
  font-family: monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--success);
  letter-spacing: 1px;
  word-break: break-all;
}

/* Toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  border: 1px solid var(--panel-border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
}
#toast.on {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Key Generator</h1>
    <p>Watch 4 short ads to unlock your access key</p>
  </header>

  <div class="main-card">
    <!-- Square Image Area -->
    <div class="image-box">
      <img src="https://i.ibb.co/5hdsCTx9/download-6.jpg">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>

    <!-- Controls / Action Area -->
    <div class="controls-box">
      <div class="progress-header">
        <span>Progress</span>
        <span id="adCountText">0 / 4 Ads Watched</span>
      </div>
      
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <button class="btn" id="watchAdBtn">
        <span>Watch Ad (1/4)</span>
      </button>

      <!-- Generated Key Result Box -->
      <div class="key-box" id="keyBox">
        <span style="font-size: 12px; color: var(--muted);">Your Key Generated Successfully!</span>
        <div class="key-value" id="keyValue">4DR-2026-REG</div>
        <button class="btn btn-success" id="copyKeyBtn">Copy Key</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function() {
  "use strict";

  /* =========================================================
     ADSGRAM BLOCK IDs CONFIGURATION
     Replace these with your exact block IDs from AdsGram dashboard.
     ========================================================= */
  var AD_BLOCKS = {
    ad1: "57813", 
    ad2: "int-57924", 
    ad3: "int-57925", 
    ad4: "57929"  
  };

  /* Initialize Telegram WebApp */
  var TG = window.Telegram && window.Telegram.WebApp;
  if (TG) {
    try {
      TG.ready();
      TG.expand();
      if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();
      if (TG.setHeaderColor) TG.setHeaderColor("#090d1a");
      if (TG.setBackgroundColor) TG.setBackgroundColor("#090d1a");
    } catch(e) {}
  }

  /* App State */
  var state = {
    adsWatched: 0,
    totalAds: 4,
    generatedKey: ""
  };

  function $(id) { return document.getElementById(id); }

  function haptic(type) {
    try {
      if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred(type);
    } catch(e) {}
  }

  var toastTimer;
  function showToast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      t.classList.remove("on");
    }, 2600);
  }

  function updateUI() {
    var progress = (state.adsWatched / state.totalAds) * 100;
    $("progressBar").style.width = progress + "%";
    $("adCountText").textContent = state.adsWatched + " / " + state.totalAds + " Ads Watched";

    var btn = $("watchAdBtn");
    if (state.adsWatched < state.totalAds) {
      btn.style.display = "flex";
      btn.disabled = false;
      
      // Update label indicating type of ad
      var adTypeStr = (state.adsWatched < 2) ? "Interstitial" : "Rewarded";
      btn.innerHTML = "<span>Watch Ad " + (state.adsWatched + 1) + "/" + state.totalAds + " (" + adTypeStr + ")</span>";
    } else {
      btn.style.display = "none";
      $("keyBox").classList.add("on");
    }
  }

  function generateRandomKey() {
    var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    var part = function() {
      var str = "";
      for (var i = 0; i < 4; i++) {
        str += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return str;
    };
    return "KEY-" + part() + "-" + part() + "-" + part();
  }

  /* AdsGram Controller logic per Block ID */
  function triggerAd(blockId, isReward, onSuccess) {
    if (!window.Adsgram) {
      showToast("Ads SDK not loaded. Please try again.");
      return;
    }

    try {
      // Initialize controller dynamically per ad unit
      var AdController = window.Adsgram.init({ blockId: blockId });
      
      AdController.show().then(function(result) {
        if (result && (result.done || !isReward)) {
          onSuccess();
        } else {
          showToast("Please watch the full ad to proceed.");
        }
      }).catch(function(err) {
        showToast("No ad available right now. Please try again.");
      });
    } catch (e) {
      showToast("Ad error occurred. Try again.");
    }
  }

  /* Watch Button Handler */
  $("watchAdBtn").onclick = function() {
    var step = state.adsWatched + 1;
    var targetBlockId = "";
    var isReward = false;

    // Route to appropriate Block ID
    if (step === 1) {
      targetBlockId = AD_BLOCKS.ad1;
      isReward = false; // Interstitial
    } else if (step === 2) {
      targetBlockId = AD_BLOCKS.ad2;
      isReward = false; // Interstitial
    } else if (step === 3) {
      targetBlockId = AD_BLOCKS.ad3;
      isReward = true;  // Rewarded
    } else if (step === 4) {
      targetBlockId = AD_BLOCKS.ad4;
      isReward = true;  // Rewarded
    }

    triggerAd(targetBlockId, isReward, function() {
      haptic("medium");
      state.adsWatched++;
      
      if (state.adsWatched === state.totalAds) {
        state.generatedKey = generateRandomKey();
        $("keyValue").textContent = state.generatedKey;
        showToast("All ads completed! Key unlocked.");
      } else {
        showToast("Ad completed (" + state.adsWatched + "/" + state.totalAds + ")");
      }
      
      updateUI();
    });
  };

  /* Copy Key Handler */
  $("copyKeyBtn").onclick = function() {
    if (!state.generatedKey) return;
    navigator.clipboard.writeText(state.generatedKey).then(function() {
      haptic("light");
      showToast("Key copied to clipboard!");
    }).catch(function() {
      showToast("Failed to copy key.");
    });
  };

  // Initial setup
  updateUI();

})();
</script>
</body>
</html>

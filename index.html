<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP PREMIUM FILES HUB</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Canvas Confetti for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090514;
            color: #ffffff;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .title-glow {
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.7), 0 0 40px rgba(236, 72, 153, 0.4);
        }

        .glow-orb-1 {
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            animation: pulse-orb 6s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            animation: pulse-orb 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulse-orb {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(26, 16, 48, 0.7) 0%, rgba(15, 9, 31, 0.85) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 92, 246, 0.08);
        }

        .btn-purple {
            background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            border: 1px solid rgba(192, 132, 252, 0.4);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: all 0.25s ease;
        }

        .btn-purple:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%) !important;
            border-color: rgba(110, 231, 183, 0.5) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5) !important;
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 70%
            );
            transform: rotate(30deg);
            animation: shimmer-effect 3s infinite;
        }

        @keyframes shimmer-effect {
            0% { transform: translate(-100%, -100%) rotate(30deg); }
            100% { transform: translate(100%, 100%) rotate(30deg); }
        }

        .progress-bar-fill {
            transition: width 0.4s ease-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 select-none relative pb-10">

    <canvas id="bgCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>
    <div class="glow-orb-1 fixed -top-20 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full pointer-events-none z-0"></div>
    <div class="glow-orb-2 fixed bottom-0 left-1/4 w-80 h-80 rounded-full pointer-events-none z-0"></div>

    <div class="w-full max-w-md my-auto flex flex-col items-center z-10 py-2">

        <div class="text-center mb-6">
            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-purple-900/40 border border-purple-500/30 mb-2">
                <i class="fa-solid fa-bolt text-xs text-yellow-400"></i>
                <span class="text-[11px] font-semibold text-purple-200 uppercase tracking-widest">Premium Content Vault</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-white title-glow uppercase tracking-wider">
                VIP FILES ARCHIVE
            </h1>
            <p class="text-xs sm:text-sm font-medium text-purple-300/80 mt-1 max-w-xs mx-auto leading-relaxed">
                Watch all 5 specific sponsor ads sequentially to unlock exclusive files.
            </p>
        </div>

        <div id="filesContainer" class="w-full space-y-4">
            <!-- Dynamic Files List -->
        </div>

        <p class="text-[10px] text-purple-400/50 mt-6 text-center font-medium">
             Verified Adsgram Safe Download Portal
        </p>

    </div>

    <!-- Notification Toast Popup -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-[#180b2e] border border-purple-500/40 text-purple-100 text-xs sm:text-sm rounded-2xl py-3.5 px-4 shadow-2xl flex items-center space-x-3 transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-info text-purple-400 text-base flex-shrink-0"></i>
        <span id="toastMessage" class="flex-grow font-semibold">Please complete watching all ads first.</span>
    </div>

    <script>
        // നിങ്ങൾ നൽകിയ കൃത്യമായ 5 Adsgram Block IDs (ഓരോ സ്റ്റെപ്പിനും ഓരോന്ന് വീതം)
        const ADSGRAM_BLOCK_IDS = [
            "58237", // Ad 1 (Step 0)
            "57813", // Ad 2 (Step 1)
            "int-57924", // Ad 3 (Step 2)
            "int-57925", // Ad 4 (Step 3 - Rewarded/Interstitial)
            "57929"      // Ad 5 (Step 4 - Rewarded)
        ];
        
        const TOTAL_ADS_REQUIRED = 5; // മൊത്തം 5 ആഡ്സ് കണ്ട് കഴിഞ്ഞാൽ ഫയൽ അൺലോക്ക് ആകും.

        const FILES_LIST = [
            {
                id: 1,
                title: "CAP CUT 2026 FOR FREE",
                category: "mod apk",
                size: "253.0 MB",
                thumbnail: "https://i.ibb.co/Hf6gDwkZ/Capcut-3-D-logo.jpg",
                downloadUrl: "https://t.me/+tPe1UZCoosgzNGE1"
            },

        ];

        let activeAdState = {}; 
        let isAdLoading = false;

        window.addEventListener('DOMContentLoaded', () => {
            initTelegramSDK();
            initBackgroundParticles();
            initFileStates();
            renderFiles();
        });

        function initTelegramSDK() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.setHeaderColor) tg.setHeaderColor('#090514');
                if (tg.setBackgroundColor) tg.setBackgroundColor('#090514');
            }
        }

        function initFileStates() {
            FILES_LIST.forEach(file => {
                activeAdState[file.id] = 0;
            });
        }

        function renderFiles() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = '';

            FILES_LIST.forEach(file => {
                const completedAds = activeAdState[file.id] || 0;
                const isCompleted = completedAds >= TOTAL_ADS_REQUIRED;
                const percentage = Math.min((completedAds / TOTAL_ADS_REQUIRED) * 100, 100);

                const cardHtml = `
                    <div class="glass-card rounded-3xl p-4 flex flex-col relative overflow-hidden">
                        <div class="flex items-center space-x-3.5 mb-3">
                            <div class="w-16 h-16 rounded-2xl overflow-hidden relative border border-purple-500/30 flex-shrink-0 bg-black/40">
                                <img src="${file.thumbnail}" alt="Thumbnail" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                            </div>
                            <div class="flex-grow min-w-0">
                                <span class="text-[10px] font-bold text-pink-400 bg-pink-950/40 border border-pink-500/20 px-2 py-0.5 rounded-full inline-block mb-1">
                                    ${file.category}
                                </span>
                                <h3 class="text-sm font-bold text-white truncate leading-snug">${file.title}</h3>
                                <p class="text-[11px] text-purple-300/70 mt-0.5 font-medium">
                                    Size: <span class="text-purple-200">${file.size}</span>
                                </p>
                            </div>
                        </div>

                        <div class="w-full bg-purple-950/60 border border-purple-500/20 rounded-full h-2 mb-3 overflow-hidden p-0.5">
                            <div class="progress-bar-fill h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full" style="width: ${percentage}%;"></div>
                        </div>

                        ${isCompleted ? `
                            <a href="${file.downloadUrl}" target="_blank" onclick="triggerConfetti()" class="w-full btn-purple btn-success py-3 px-4 rounded-xl font-bold text-xs sm:text-sm text-white flex items-center justify-center space-x-2 shadow-lg">
                                <i class="fa-solid fa-download"></i>
                                <span>Download File Now</span>
                            </a>
                        ` : `
                            <button onclick="handleWatchAdForFile(${file.id})" class="w-full btn-purple shimmer py-3 px-4 rounded-xl font-bold text-xs sm:text-sm text-white flex items-center justify-center space-x-2 shadow-md">
                                <i id="icon-file-${file.id}" class="fa-solid fa-play text-xs"></i>
                                <span id="text-file-${file.id}">Watch Ad ${completedAds + 1} of ${TOTAL_ADS_REQUIRED}</span>
                            </button>
                        `}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // കൃത്യമായ ഓരോ സ്റ്റെപ്പിനും അതത് ബ്ലോക്ക് ഐഡി മാപ്പ് ചെയ്ത് ആഡ് ലോഡ് ചെയ്യുന്ന ഫംഗ്ഷൻ
        function handleWatchAdForFile(fileId) {
            if (isAdLoading) return;

            let currentStep = activeAdState[fileId] || 0;
            if (currentStep >= TOTAL_ADS_REQUIRED) {
                showToast("File is already unlocked!", "success");
                return;
            }

            // ഓരോ ക്ലിക്കിനും നിലവിലെ സ്റ്റെപ്പിന് അനുയോജ്യമായ ബ്ലോക്ക് ഐഡി എടുക്കുന്നു (0 to 4)
            const currentBlockId = ADSGRAM_BLOCK_IDS[currentStep];

            isAdLoading = true;
            const btnText = document.getElementById(`text-file-${fileId}`);
            const btnIcon = document.getElementById(`icon-file-${fileId}`);
            
            if (btnText) btnText.innerText = `Loading Ad ${currentStep + 1}...`;
            if (btnIcon) btnIcon.className = "fa-solid fa-spinner fa-spin text-xs";

            if (window.Adsgram) {
                try {
                    const AdController = window.Adsgram.init({ blockId: currentBlockId });
                    AdController.show().then((result) => {
                        onAdSuccess(fileId);
                    }).catch((error) => {
                        console.warn("Adsgram network notice:", error);
                        if (isLocalOrPreview()) {
                            onAdSuccess(fileId, "[Demo]");
                        } else {
                            showToast("Ad display interrupted. Please try again.", "error");
                            resetAdState();
                        }
                    });
                } catch (err) {
                    console.error("Adsgram init error:", err);
                    if (isLocalOrPreview()) {
                        onAdSuccess(fileId, "[Demo]");
                    } else {
                        showToast("Failed to initialize ad network.", "error");
                        resetAdState();
                    }
                }
            } else {
                setTimeout(() => {
                    onAdSuccess(fileId, "[Demo]");
                }, 800);
            }
        }

        function onAdSuccess(fileId, tag = "") {
            activeAdState[fileId] = (activeAdState[fileId] || 0) + 1;
            isAdLoading = false;
            renderFiles();

            const count = activeAdState[fileId];
            if (count >= TOTAL_ADS_REQUIRED) {
                triggerConfetti();
                showToast("🎉 All 5 Ads Completed! File Unlocked.", "success");
            } else {
                showToast(`${tag} Ad ${count} completed! Watch next.`, "success");
            }
        }

        function resetAdState() {
            isAdLoading = false;
            renderFiles();
        }

        function isLocalOrPreview() {
            return (
                window.location.protocol === 'file:' ||
                window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1' ||
                !window.Adsgram
            );
        }

        let toastTimeout;
        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.innerText = message;

            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-base flex-shrink-0";
            } else if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-base flex-shrink-0";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-purple-400 text-base flex-shrink-0";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3200);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { y: 0.6 },
                    colors: ['#a855f7', '#ec4899', '#10b981', '#ffffff']
                });
            }
        }

        function initBackgroundParticles() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = Array.from({ length: 25 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? 'rgba(168, 85, 247, ' : 'rgba(236, 72, 153, ',
                alpha: Math.random() * 0.4 + 0.2,
                vy: -Math.random() * 0.3 - 0.1
            }));

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.zones?.forEach; // safe render
                particles.forEach(p => {
                    p.y += p.vy;
                    if (p.y < 0) {
                        p.y = canvas.height;
                        p.x = Math.random() * canvas.width;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.fill();
                });
                requestAnimationFrame(render);
            }
            render();
        }
    </script>
</body>
</html>
